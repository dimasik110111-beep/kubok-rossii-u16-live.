name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Smoke test FHR feed
        run: |
          curl -fsS https://kubok-u16-live.dimasik110111.workers.dev/api/v1/debug/source | jq '{ok, calendarStatus, calendarCount, calendarMinDate, calendarMaxDate, homeStatus, homeTitle, links, scripts}'
          curl -fsS https://kubok-u16-live.dimasik110111.workers.dev/api/v1/matches | jq '{ok, fetchedAt, refreshHintSeconds, liveVerified, matchesCount: (.matches | length), firstMatch: .matches[0], lastMatch: .matches[-1]}'
          curl -sS 'https://kubok-u16-live.dimasik110111.workers.dev/api/v1/debug/game?id=25170375' | jq '{ok, httpStatus, finalUrl, contentType, htmlLength, title, textPreview, scriptSrcs, hrefs, inlineScripts, markers}'
