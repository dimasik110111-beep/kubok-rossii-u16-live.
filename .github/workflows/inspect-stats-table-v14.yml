name: Inspect FHR full leaderboard table DOM
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/inspect-stats-table-v14.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 -m pip -q install beautifulsoup4
          python3 - <<'PY'
          import re,urllib.request,urllib.parse
          from bs4 import BeautifulSoup
          url='https://junior.fhr.ru/tournaments/kubokrossii-25008909/stats/'
          html=urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=25).read().decode()
          soup=BeautifulSoup(html,'html.parser')
          link=soup.select_one('a[data-ajax-link*="stats=BOMBARDIRS"]')
          target=urllib.parse.urljoin(url,link['data-ajax-link'])
          h=urllib.request.urlopen(urllib.request.Request(target,headers={'User-Agent':'Mozilla/5.0','Referer':url}),timeout=25).read().decode()
          s=BeautifulSoup(h,'html.parser')
          for el in s.select('table'):
            print('TABLE',str(el)[:14000].replace('\n',' '),flush=True)
          for key in ['Тимуршин','Котов','player__main','table','pagination','Показать ещё','js-ajax','table-row','stat-table','Бомбардиры']:
            p=h.find(key)
            if p>=0:print('NEAR',key,re.sub(r'\s+',' ',h[max(0,p-250):p+1300])[:1530],flush=True)
          for selector in ['.table-row','.table-item','.player','.players-list','.general-stat','.stat-table','.stats-tab','.table-wrap','.statistic-table','.table__row','.table__item','.fhr-stat','.table','.pagination']:
            els=s.select(selector)
            if els:print('SEL',selector,len(els),str(els[0])[:900].replace('\n',' '),flush=True)
          PY
