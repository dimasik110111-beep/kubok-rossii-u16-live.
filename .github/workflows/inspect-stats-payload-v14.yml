name: Inspect complete FHR skater and goalie stats
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/inspect-stats-payload-v14.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 -m pip -q install beautifulsoup4
          python3 - <<'PY'
          import urllib.request,urllib.parse,json
          from bs4 import BeautifulSoup
          url='https://junior.fhr.ru/tournaments/kubokrossii-25008909/stats/'
          soup=BeautifulSoup(urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=25).read(),'html.parser')
          for kind in ['BOMBARDIRS','GOALKEEPER','GOALKEEPER_KN']:
            link=soup.select_one('a[data-ajax-link*="stats='+kind+'"]')
            if not link:print('NO LINK',kind,flush=True);continue
            page=urllib.parse.urljoin(url,link['data-ajax-link'])
            child=BeautifulSoup(urllib.request.urlopen(urllib.request.Request(page,headers={'User-Agent':'Mozilla/5.0'}),timeout=25).read(),'html.parser')
            elem=child.select_one('.js-data-tables__filter[data-ajax]')
            if not elem:print('NO TABLE',kind,flush=True);continue
            ajax=urllib.parse.urljoin(url,elem['data-ajax'])
            ajax+='&draw=1&start=0&length=700'
            req=urllib.request.Request(ajax,headers={'User-Agent':'Mozilla/5.0','X-Requested-With':'XMLHttpRequest'})
            data=json.load(urllib.request.urlopen(req,timeout=45))
            print('KIND',kind,'AJAX',elem['data-ajax'],'ROWS',len(data['data']),'TOTAL',data['recordsTotal'],flush=True)
            if data['data']:
              print('FIELDS',list(data['data'][0]),flush=True)
              print('FIRST',str(data['data'][0])[:5200],flush=True)
              print('LAST',str(data['data'][-1])[:1100],flush=True)
          PY
