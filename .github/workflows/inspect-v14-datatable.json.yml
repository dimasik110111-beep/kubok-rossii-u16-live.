name: Fetch full FHR leaderboard DataTables payload
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/inspect-v14-datatable.json.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - run: |
          pip -q install beautifulsoup4
          python3 - <<'PY'
          import urllib.request,urllib.parse,json,re
          from bs4 import BeautifulSoup
          page='https://junior.fhr.ru/tournaments/kubokrossii-25008909/stats/'
          s=BeautifulSoup(urllib.request.urlopen(urllib.request.Request(page,headers={'User-Agent':'Mozilla/5.0'}),timeout=30).read(),'html.parser')
          for metric in ['BOMBARDIRS','GOALKEEPER','GOALKEEPER_KN']:
            link=s.select_one('a[data-ajax-link*="stats='+metric+'"]')
            url=urllib.parse.urljoin(page,link['data-ajax-link'])
            body=BeautifulSoup(urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=25).read(),'html.parser')
            holder=body.select_one('[data-ajax*="/fhr-ajax/"]')
            assert holder,metric
            target=urllib.parse.urljoin(page,holder['data-ajax'])
            print('METRIC',metric,'URL',target,'HOLDER',holder.get('class'),flush=True)
            req=urllib.request.Request(target,headers={'User-Agent':'Mozilla/5.0','Referer':url,'X-Requested-With':'XMLHttpRequest','Accept':'application/json,text/html,*/*'})
            with urllib.request.urlopen(req,timeout=40) as r:raw=r.read()
            print('HTTP',r.status,'TYPE',r.headers.get('content-type'),'BYTES',len(raw),'START',raw[:4000].decode('utf-8','ignore'),flush=True)
            try:
              j=json.loads(raw)
              print('JSON',metric,'type',type(j).__name__,'keys',list(j.keys())[:20] if isinstance(j,dict) else 'array',flush=True)
              if isinstance(j,dict):
                rows=j.get('data',[])
                print('ROWS',len(rows),'TOTAL',j.get('recordsTotal'),'ROW',repr(rows[0])[:5000] if rows else '',flush=True)
            except Exception as e:print('NOT_JSON',repr(e),flush=True)
          PY
