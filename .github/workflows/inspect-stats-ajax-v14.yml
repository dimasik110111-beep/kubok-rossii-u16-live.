name: Inspect FHR full stats AJAX response
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/inspect-stats-ajax-v14.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 -m pip -q install beautifulsoup4
          python3 - <<'PY'
          import urllib.request,urllib.parse,json,re
          from bs4 import BeautifulSoup
          base='https://junior.fhr.ru'
          url=base+'/tournaments/kubokrossii-25008909/stats/'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          html=urllib.request.urlopen(req,timeout=35).read().decode('utf-8','ignore')
          soup=BeautifulSoup(html,'html.parser')
          links=soup.select('a[data-ajax-link*="stats="]')
          print('ALL LINKS',len(links),flush=True)
          for link in links[:3]:
            target=urllib.parse.urljoin(url,link.get('data-ajax-link').replace('&amp;','&'))
            print('TARGET',target[:650],flush=True)
            for method,headers in [('GET',{'User-Agent':'Mozilla/5.0','X-Requested-With':'XMLHttpRequest','Referer':url}),('GET-noajax',{'User-Agent':'Mozilla/5.0','Referer':url})]:
              try:
                req=urllib.request.Request(target,headers=headers)
                with urllib.request.urlopen(req,timeout=35) as response:
                  raw=response.read()
                  h=raw.decode('utf-8','ignore')
                  print('HTTP',method,response.status,'LEN',len(h),'TYPE',response.headers.get('content-type'),flush=True)
                  print('START',re.sub(r'\s+',' ',h[:2500]),flush=True)
                  j=None
                  try:j=json.loads(h)
                  except Exception:pass
                  if isinstance(j,dict):
                    print('KEYS',list(j)[:15],flush=True)
                    for key,value in j.items():
                      if isinstance(value,str):
                        soup2=BeautifulSoup(value,'html.parser')
                        print('KEY',key,'LEN',len(value),'TR',len(soup2.select('tr')),'LI',len(soup2.select('.player')),'TABLES',len(soup2.select('table')),flush=True)
                        print('KEY START',re.sub(r'\s+',' ',value[:2400]),flush=True)
                  else:
                    ss=BeautifulSoup(h,'html.parser')
                    print('PARSED','TABLES',len(ss.select('table')),'TR',len(ss.select('tr')),'PLAYERS',len(ss.select('.player')),'ROWS',len(ss.select('.statistic-row')),flush=True)
              except Exception as e:print('ERROR',method,str(e),flush=True)
          PY
