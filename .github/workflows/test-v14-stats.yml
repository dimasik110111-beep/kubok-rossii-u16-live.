name: Verify complete v14 statistics API
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/test-v14-stats.yml']
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.parse
          base='https://kubok-u16-live.dimasik110111.workers.dev/api/v1/stats'
          def get(url):
            req=urllib.request.Request(url,headers={'User-Agent':'JUNIOR-U16-v14-test'})
            with urllib.request.urlopen(req,timeout=45) as r:return json.load(r)
          data=get(base)
          print('COUNTS',data.get('skaterCount'),data.get('goalieCount'),'GROUPS',data.get('availableGroups'),flush=True)
          assert data.get('ok') and data.get('complete')
          assert data['skaterCount']>=400 and data['goalieCount']>=40
          assert len(data['skaters'])==data['skaterCount'] and len(data['goalies'])==data['goalieCount']
          duplicates=[p for p in data['skaters'] if sum(x['id']==p['id'] for x in data['skaters'])>1]
          print('SKATER DUPLICATE IDS',[(p['id'],p['name'],p['team']) for p in duplicates[:12]],flush=True)
          assert len({(p['id'],p['team']) for p in data['skaters']})==len(data['skaters'])
          assert len({(p['id'],p['team']) for p in data['goalies']})==len(data['goalies'])
          for p in data['skaters']+data['goalies']:
            assert p['name'] and p['team'] and p['id']
            assert p['photo'].startswith('https://img.fhr.ru/players/')
            assert p['teamLogo'].startswith('https://img.fhr.ru/teams/')
            assert p['profile'].startswith('https://junior.fhr.ru/player/')
          for p in data['skaters']:
            assert p['goals']+p['assists']==p['points'],p
          first=next((x for x in data['availableGroups'] if x.startswith('Группа ')),None)
          assert first is not None
          stage=get(base+'?group='+urllib.parse.quote(first))
          print('GROUP',first,'SKATERS',len(stage['skaters']),'GOALIES',len(stage['goalies']),flush=True)
          assert stage['ok'] and stage['group']==first
          assert 5<len(stage['skaters'])<len(data['skaters'])
          PY
